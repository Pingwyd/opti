name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Run tests
        run: python -m pytest tests/ -q --ignore=tests/test_voice.py

      - name: Resolve version
        id: version
        run: |
          $tag = "${{ github.ref_name }}"
          if ("${{ github.ref_type }}" -eq "tag" -and $tag -match '^v(.+)$') {
            $version = $Matches[1]
          } else {
            $version = (Select-String -Path brand.py -Pattern 'APP_VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          }
          Write-Host "Version: $version"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"

      - name: Build (PyInstaller)
        run: pyinstaller packaging/opti.spec --noconfirm --clean

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      # Runs before the portable marker is added so portable.txt cannot leak
      # into the installer.
      - name: Build installer
        working-directory: packaging
        run: |
          $iscc = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "${env:ProgramFiles}\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc.FullName "/DMyAppVersion=${{ steps.version.outputs.version }}" installer.iss

      - name: Add portable marker
        working-directory: dist/Opti
        run: copy ..\..\packaging\portable.txt portable.txt

      - name: Zip portable build
        working-directory: dist
        run: Compress-Archive -Path Opti -DestinationPath Opti-portable.zip -Force

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Opti-portable-windows
          path: dist/Opti-portable.zip

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Opti-setup-windows
          path: packaging/Output/Opti-Setup-*.exe

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Opti-portable.zip
            packaging/Output/Opti-Setup-*.exe
          generate_release_notes: true
